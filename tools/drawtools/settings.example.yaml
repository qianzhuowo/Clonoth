api:
  base_url: https://image.novelai.net
  api_key_env: NOVELAI_API_KEY
  api_key: ''
  timeout_sec: 130
# 生成队列 / 重试设置
#
# 【普通错误重试】适用于 5xx / 连接失败 / 超时等非并发锁错误：
#   request_delay_sec: 每张图生成请求结束后，队列释放前额外等待秒数，用于降低 429 风险。
#   retry_wait_sec:     每次重试前固定等待秒数。
#   retry_max_attempts: 最大重试次数；默认 5 表示失败后最多再试 5 次。
#   lock_timeout_sec:   等待本地全局 NovelAI 队列锁（同进程串行）的最长秒数。
#
# 【并发锁专用重试】仅适用于 NovelAI 服务端返回 HTTP 429 "Concurrent generation is locked"（账号层面并发额度未释放）：
#   与上面普通重试互斥，且并发锁判定优先；命中并发锁时不会消耗 retry_max_attempts 名额。
#   lock_retry_max_attempts: 命中并发锁时的最大重试次数（默认 8）。
#   lock_retry_wait_min_sec: 每次重试前的随机等待秒数下限（默认 6）。
#   lock_retry_wait_max_sec: 每次重试前的随机等待秒数上限（默认 8）；每次在 [min, max] 区间内随机取值，不递增。
generation:
  request_delay_sec: 0
  retry_wait_sec: 3
  retry_max_attempts: 5
  lock_timeout_sec: 3600
  lock_retry_max_attempts: 8
  lock_retry_wait_min_sec: 6
  lock_retry_wait_max_sec: 8
# 附件清理设置。清理对象：data/attachments/novelai 下的生成图。
# retention_days: 删除超过 N 天的旧图。
# max_total_mb: 若目录总容量超过该值，按修改时间从旧到新继续删除，直到低于上限。
# cleanup_interval_sec: 自动清理最小间隔；生成图片时会顺带触发一次轻量检查。
storage:
  cleanup_enabled: true
  retention_days: 7
  max_total_mb: 2048
  cleanup_interval_sec: 3600
params:
  selected_preset_id: default-v45-full
  size_options:
    横图:
      width: 1216
      height: 832
    竖图:
      width: 832
      height: 1216
    方图:
      width: 1024
      height: 1024
  presets:
  - id: default-v45-full
    name: 默认 (V4.5 Full)
    positive_prefix: best quality, amazing quality, very aesthetic, absurdres
    negative_prefix: lowres, bad anatomy, bad hands, missing fingers, extra digits,
      fewer digits, cropped, worst quality, low quality, normal quality, jpeg artifacts,
      signature, watermark, username, blurry
    max_images: 0
    max_characters_per_image: 4
    # 画幅：auto = 按每张图的构图方向取 832x1216（竖）或 1216x832（横）；default = 用 params 里的 width / height
    override_size: auto
    params:
      model: nai-diffusion-4-5-full
      sampler: k_euler_ancestral
      scheduler: karras
      steps: 28
      scale: 6
      seed: -1
      qualityToggle: true
      ucPreset: 0
      autoSmea: false
      cfg_rescale: 0
      variety_boost: false
      sm: false
      sm_dyn: false
      decrisper: false
  - id: cute-v45
    name: 可爱风
    positive_prefix: best quality, amazing quality, very aesthetic, absurdres, cute
      anime style, soft lighting, pastel colors, delicate eyes
    negative_prefix: lowres, bad anatomy, bad hands, missing fingers, extra digits,
      fewer digits, cropped, worst quality, low quality, watermark, blurry
    max_images: 0
    max_characters_per_image: 4
    override_size: auto
    params:
      model: nai-diffusion-4-5-full
      sampler: k_euler_ancestral
      scheduler: karras
      steps: 28
      scale: 5.5
      seed: -1
      qualityToggle: true
      ucPreset: 0
      autoSmea: false
      cfg_rescale: 0
      variety_boost: false
      sm: false
      sm_dyn: false
      decrisper: false
character_tags:
  path: tools/drawtools/character_tags.yaml
  auto_search_unknown: true
llm:
  provider: openai
  model_env: DRAW_TAG_MODEL
  api_key_env: DRAW_TAG_API_KEY
  base_url_env: DRAW_TAG_BASE_URL
  use_stream: false
prompts:
  top_system_path: tools/drawtools/prompts/novelai/top-system.md
  tag_guide_path: tools/drawtools/prompts/novelai/tag-guide.md
  scene_rules_path: tools/drawtools/prompts/novelai/scene-rules.md
# 场景 Agent（规划模型）的接口预设：由面板“场景 Agent”页写入私有 settings.yaml，key 不要写在这个模板里。
# 只管 draw.novelai_planner；draw.image_gen 仍用节点自身的模型配置。
# 当前预设没填 Model 或 API Key 时不接管，规划用节点自身的配置（config/nodes/draw.novelai_planner.yaml，即 DRAW_TAG_*）。
agent:
  # 整次规划失败后的自动重试次数（0-10，0 = 不重试）；只重试规划，不重试出图
  planner_max_retries: 3
  presets: []
# 场景规划 agent（draw.novelai_planner 由 plugins/draw/agent 接管）
planner:
  # tool_protocol 与 timeout_sec 现在跟着上面的 agent 预设走；这里的值只在还没有预设时用来生成“默认”预设。
  # 工具协议：native=模型原生 function calling；text=<<<TOOL_CALL>>> JSON 文本块
  tool_protocol: native
  # 校验失败回错重提的最大轮次；纯自定义工具（如 search_web）轮次不占次数，总上限 max_custom_tool_calls
  max_attempts: 3
  max_custom_tool_calls: 5
  # 单次请求超时（秒）
  timeout_sec: 180
  # 全局硬上限：预设 max_images=0 时由 agent 决定张数，但不超过此值
  max_plan_images: 4
  # 画幅现在跟着绘图参数预设走（预设的 override_size + params.width / height，在面板“绘图参数”页设置）。
  # 这一项只给还没写 override_size 的旧预设用：填了固定尺寸（如 1024x1024）就沿用它，auto 即按构图方向。
  override_size: auto
  # 请求结构布局（面板“提示词模板→请求结构”编辑器写入；null 表示用内置默认顺序）
  layout: null
  # submit_scene_plan 字段说明覆盖（面板写入；缺省用内置说明）
  field_descriptions: {}
