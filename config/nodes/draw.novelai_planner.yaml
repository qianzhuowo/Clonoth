id: draw.novelai_planner
type: ai
name: "NovelAI 绘图分析与生成"
description: "绘图场景规划节点：由 plugins/draw/agent 在 before_prompt_build 钩子接管，组装规划消息链 → 模型调用 submit_scene_plan → 编译 NovelAI 请求并生成图片 → 直接 finish。"

provider: openai
# [2026-08-01] 绘图分析(写 tag/prompt)专用模型，与压缩/摘要/读图/生图隔离。
model: $ENV{DRAW_TAG_MODEL}
api_key: $ENV{DRAW_TAG_API_KEY}
base_url: $ENV{DRAW_TAG_BASE_URL}

# 面板“场景 Agent”页的当前预设填了 Model 和 API Key 时，规划改用预设里的接口，上面三项只作兜底；
# 但引擎在接管前仍会检查本节点能解析出 key，所以 DRAW_TAG_API_KEY（或全局 key）要保留。
# 工具协议由场景 Agent 预设的 tool_mode 决定（native / text；还没有预设时取 settings.yaml 的 planner.tool_protocol），
# 此处 tool_mode 只影响引擎常规循环；agent 接管后不会走常规循环。
tool_mode: json
output_mode: hybrid

# [2026-08-01] 节点模型不支持视觉，收到带 image_url 的多模态消息会 400 报错。
# 开启后引擎在调用 provider 前自动剥离所有图片内容块，只保留文字。
strip_images: true

# agent 在规划阶段允许模型调用的自定义工具（submit_scene_plan 为内置协议工具，不在此列）。
tool_access:
  mode: allowlist
  allow:
    - search_web

skills:
  mode: none

# 仅作兜底：若 plugins/draw 未加载、钩子未接管，模型看到的提示词。
prompt: |
  {{include:_shared.md}}

  # Role: NovelAI Scene Planner

  你是 Clonoth 的专用 NovelAI 绘图分析节点。当前时间：{{now}}。
  当前用户绘图请求如下：

  {{instruction}}

  本节点应由绘图插件接管；若你看到这段文字，说明插件未加载。请用 `finish` 如实告知用户
  “绘图插件未启用，暂时无法生图”，不要臆造任何生成结果或图片路径。
